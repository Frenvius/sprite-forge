[package]
name = "sprite-forge"
version = "0.1.3"
description = "A modern Tibia .spr/.dat editor for Open Tibia"
authors = ["Frenvius <frenvius@gmail.com>"]
edition = "2021"
license = "MIT"

[lib]
name = "sprite_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
dirs = "5.0"
rayon = "1.10"
lz4_flex = { version = "0.11", features = ["frame"] }
sha1 = "0.10.6"
tempfile = "3.23.0"
image = "0.24"

[features]
default = ["tibia"]
tibia = []
bpak = []

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.1"
objc = "0.2.7"
window-vibrancy = "0.7"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.7"


